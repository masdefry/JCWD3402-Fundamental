<script>
  class Products {
    name = '';
    price = 0;
    stocks = 0;

    constructor(_name, _price, _stocks) {
      this.name = _name;
      this.price = _price;
      this.stocks = _stocks;
    }

    isStockAvailable(qty) {
      if (qty > this.stocks) return false;

      return true;
    }
  }

  class Stores {
    products = [];

    addProduct(product) {
      // {name, price, stocks}
      this.products.push(product);
    }

    displayProduct() {
      let printProduct = '';

      this?.products?.forEach((item, index) => {
        printProduct += `${index + 1}. ${
          item.name
        }: Rp. ${item.price.toLocaleString('id-ID')} (Stocks ${
          item.stocks
        }) \n`;
      });

      return printProduct;
    }

    checkout() {
      // Step-01  : Show List of products using prompt
      const selectedProduct =
        parseInt(prompt(`${this?.displayProduct()} \n Select product first:`)) -
        1;

      // Step-02
      do {
        var qty = prompt(`Input quantity of selected product`);
      } while (this?.products[selectedProduct].isStockAvailable(qty) === false);

      //  Step-03
      alert(`
     ${this?.products[selectedProduct].name}:Rp.${
        this?.products[selectedProduct].price
      } x ${qty} = Rp.${this?.products[selectedProduct].price * qty}
    `);
    }
  }

  const stores = new Stores();
  stores.addProduct(new Products('Apel', 15000, 15));
  stores.addProduct(new Products('Anggur', 25000, 25));
  stores.addProduct(new Products('Jeruk', 35000, 35));

  stores.checkout();
</script>

            Method:

                                  : 1. Apel: Rp.xxx (Stock: xx)

                1. Tampilkan list product menggunakan prompt -> User dapat mengisikan nomor product pada prompt tersebut
